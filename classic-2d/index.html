<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle City — 2-Player Browser Replica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cabinet">
    <header class="cabinet-header">
      <h1>BATTLE CITY</h1>
      <div class="toolbar">
        <button id="btn-mute" type="button" title="Toggle Sound (M)">🔊 Sound: ON</button>
        <button id="btn-pause" type="button" title="Pause / Resume (P)">⏸ Pause</button>
        <button id="btn-menu" type="button" title="Return to Title Screen">🏠 Title</button>
      </div>
    </header>

    <div class="screen-bezel">
      <canvas id="game-canvas" width="768" height="672" aria-label="Battle City game screen"></canvas>
    </div>

    <section class="controls-bar" aria-label="Player controls">
      <div class="player-card p1">
        <div class="player-badge">
          <span class="swatch p1-swatch"></span>
          <strong>1P (Yellow)</strong>
        </div>
        <div class="keys">
          <span>Move: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
          <span>Fire: <kbd>Space</kbd> / <kbd>F</kbd></span>
          <span>Grab/Drop Wall: <kbd>E</kbd></span>
        </div>
      </div>

      <div class="player-card p2">
        <div class="player-badge">
          <span class="swatch p2-swatch"></span>
          <strong>2P (Green)</strong>
        </div>
        <div class="keys">
          <span>Move: <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></span>
          <span>Fire: <kbd>Enter</kbd> / <kbd>/</kbd></span>
          <span>Grab/Drop: <kbd>R-Ctrl</kbd> / <kbd>\</kbd></span>
        </div>
      </div>

      <div class="player-card p3">
        <div class="player-badge">
          <span class="swatch p3-swatch"></span>
          <strong>3P (Blue)</strong>
        </div>
        <div class="keys">
          <span>Move: <kbd>U</kbd><kbd>H</kbd><kbd>J</kbd><kbd>K</kbd></span>
          <span>Fire: <kbd>I</kbd></span>
          <span>Grab/Drop: <kbd>O</kbd> / <kbd>Y</kbd></span>
        </div>
      </div>

      <div class="player-card sys">
        <div class="player-badge"><strong>System</strong></div>
        <div class="keys">
          <span>Pause: <kbd>P</kbd></span>
          <span>Mute: <kbd>M</kbd></span>
          <span>Select: <kbd>↑</kbd><kbd>↓</kbd> + <kbd>Enter</kbd></span>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/game.js"></script>
</body>
</html>
